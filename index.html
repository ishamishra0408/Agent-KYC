<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent KYCReady</title>
    <meta name="description" content="Driver KYC, rebuilt AI-first: a model reads the documents, a policy decides, people decide the hard cases." />
    <!-- The link preview card, also the README's picture (npm run og builds public/og.jpg from docs/demo.jpg). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Agent KYCReady" />
    <meta property="og:description" content="Driver KYC, rebuilt AI-first: a model reads the documents, a policy decides, people decide the hard cases." />
    <meta property="og:url" content="https://agent-kycready.onrender.com/" />
    <meta property="og:image" content="https://agent-kycready.onrender.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Agent KYCReady: a driver's phone beside the ops console, with a case sent to a person" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Agent KYCReady" />
    <meta name="twitter:description" content="Driver KYC, rebuilt AI-first: a model reads the documents, a policy decides, people decide the hard cases." />
    <meta name="twitter:image" content="https://agent-kycready.onrender.com/og.jpg" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved theme before first paint, so the page never flashes the other one.
      try {
        var t = localStorage.getItem("kycready.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Barlow for Latin; Mukta covers Devanagari, so Hindi falls back to it (D-044). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- The mark (D-044), as real files with a version in the URL (F-027): a browser keeps its own copy
         of a site's icon, and an icon written into the page itself wasn't refreshed when it changed. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
